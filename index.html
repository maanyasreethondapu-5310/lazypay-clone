<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DueLater — Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">⚡ DueLater</div>
      <div class="greeting" id="greeting"></div>

      <div class="credit-card">
        <div class="label">Available to spend</div>
        <div class="amount" id="available-amount"></div>
        <div class="bar">
          <div class="bar-fill" id="bar-fill" style="width: 0%;"></div>
        </div>
        <div class="sub-row">
          <span id="limit-label"></span>
          <span id="used-label"></span>
        </div>
      </div>
    </div>

    <div id="alerts"></div>

    <div class="content">
      <div class="section-title">Quick actions</div>
      <div class="quick-actions">
        <a href="checkout.html">
          <span class="emoji">💳</span>Pay Later
        </a>
        <a href="history.html">
          <span class="emoji">🧾</span>Statement
        </a>
      </div>

      <div id="next-due-section"></div>

      <div class="section-title">
        Recent activity
        <a href="history.html">See all</a>
      </div>
      <div class="card" id="recent-activity"></div>

      <div class="disclaimer">Prototype only — simulated credit line, no real money or KYC.</div>
      <form class="reset-form" id="reset-form">
        <button type="submit">Reset demo data</button>
      </form>
    </div>

    <div class="bottom-nav">
      <a href="index.html" class="active"><span class="emoji">🏠</span>Home</a>
      <a href="checkout.html"><span class="emoji">💳</span>Pay Later</a>
      <a href="history.html"><span class="emoji">🧾</span>History</a>
    </div>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
